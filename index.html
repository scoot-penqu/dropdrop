<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropDrop - Discovery Radar</title>
    <style>
        :root {
            --bg: #0b0e14; --surface: #161b22; --border: #30363d; --text: #f0f6fc;
            --accent-yellow: #f1c40f; --accent-blue: #3498db; --accent-green: #2ecc71;
            --accent-purple: #9b59b6; --accent-orange: #e67e22; --accent-red: #e74c3c;
        }
/* Custom Pokéball Letter 'O' */
        .pokeball {
            display: inline-block;
            width: 0.8em;
            height: 0.8em;
            border-radius: 50%;
            background: linear-gradient(to bottom, #e74c3c 45%, #161b22 45%, #161b22 55%, #f0f6fc 55%);
            border: 0.08em solid #f0f6fc;
            position: relative;
            vertical-align: -0.05em;
            margin: 0 0.05em;
        }
        .pokeball::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0.25em;
            height: 0.25em;
            background: #f0f6fc;
            border-radius: 50%;
            border: 0.08em solid #161b22;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 1.5rem; max-width: 1400px; margin: auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 2.2rem; color: var(--accent-yellow); margin-bottom: 0.5rem; }
        header p { color: #8b949e; }
        .dashboard-container { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; }
        
        .filters { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent-yellow); color: #000; font-weight: bold; }
        
        .drop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card-img-container { width: 100%; height: 180px; background: #0d1117; display: flex; align-items: center; justify-content: center; padding: 1rem; border-bottom: 1px solid var(--border); }
        .card-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-body { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; }
        
        .tags { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
        .badge { font-size: 0.7rem; padding: 0.2rem 0.4rem; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .badge-live { background: var(--accent-green); color: #000; }
        .badge-past { background: var(--accent-red); color: #fff; }
        .badge-domain { background: var(--accent-blue); color: #fff; }
        
        .card-title { font-size: 1rem; margin-bottom: 0.4rem; line-height: 1.3; }
        .price { color: var(--accent-yellow); font-size: 0.95rem; font-weight: bold; margin-bottom: 0.5rem; }
        .retailer { font-size: 0.85rem; color: #8b949e; margin-bottom: 0.8rem; text-transform: capitalize; }
        .countdown { margin-top: auto; font-family: monospace; font-size: 0.8rem; background: #0d1117; padding: 0.4rem; border-radius: 6px; text-align: center; color: #8b949e; border: 1px solid #21262d; }
        .buy-btn { display: block; margin-top: 0.8rem; text-align: center; background: var(--accent-yellow); color: #000; padding: 0.5rem; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        
        .radar-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem; height: fit-content; }
        .radar-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; margin-bottom: 1rem; }
        .radar-title { font-size: 1.1rem; color: var(--accent-orange); display: flex; align-items: center; gap: 0.5rem; }
        
        .rumor-card { background: #0d1117; border: 1px dashed var(--border); border-radius: 8px; padding: 0.8rem; margin-bottom: 0.8rem; }
        .rumor-source { font-size: 0.75rem; color: #8b949e; display: flex; justify-content: space-between; margin-bottom: 0.3rem; }
        .rumor-title { font-size: 0.95rem; font-weight: bold; color: #f0f6fc; margin-bottom: 0.3rem; }
        .rumor-desc { font-size: 0.8rem; color: #8b949e; line-height: 1.3; }
        .rumor-confidence { font-size: 0.7rem; color: var(--accent-yellow); margin-top: 0.4rem; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>⚡ Dr<span class="pokeball"></span>pDr<span class="pokeball"></span>p</h1>
        <p>Auto-scraping reliable retailers for MSRP drops & recent restocks.</p>
    </header>
    <div class="dashboard-container">
        <main>
            <div class="filters">
                <button class="filter-btn active" onclick="filterDrops('live')">Active Drops</button>
                <button class="filter-btn" onclick="filterDrops('past')">Recent / Past Drops</button>
                <button class="filter-btn" onclick="loadLiveData()" style="background: var(--accent-blue); color: white; margin-left: auto;">🔄 Sync Latest Data</button>
            </div>
            <div class="drop-grid" id="dropGrid"></div>
        </main>
        <aside class="radar-panel">
            <div class="radar-header">
                <div class="radar-title">📡 Leak Radar</div>
            </div>
            <div id="rumorFeed"></div>
        </aside>
    </div>

    <script>
        let allDrops = [];

        async function loadLiveData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                allDrops = data.drops;
                renderDrops('live'); // Default to showing active drops
                renderRumors(data.rumors);
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        function renderDrops(filter) {
            const container = document.getElementById('dropGrid');
            container.innerHTML = '';
            
            // Filter out items based on status (live vs past)
            const filtered = allDrops.filter(d => d.status === filter);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: #8b949e; grid-column: 1/-1; text-align:center;">No ${filter} drops found in the recent scan.</p>`;
                return;
            }

            filtered.forEach(drop => {
                const isPast = drop.status === 'past';
                const card = document.createElement('div');
                card.className = 'card';
                card.style.opacity = isPast ? '0.7' : '1'; // Dim past drops slightly

                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${drop.image}" alt="Product Image" class="card-img" onerror="this.src='https://via.placeholder.com/200x150?text=No+Thumbnail'">
                    </div>
                    <div class="card-body">
                        <div class="tags">
                            <span class="badge ${isPast ? 'badge-past' : 'badge-live'}">${isPast ? 'EXPIRED / OOS' : 'ACTIVE DROP'}</span>
                            <span class="badge badge-domain">${drop.retailer}</span>
                        </div>
                        <h2 class="card-title">${drop.title}</h2>
                        <div class="price">${drop.price}</div>
                        <div class="countdown">Found: ${new Date(drop.date).toLocaleDateString()}</div>
                        <a href="${drop.link}" target="_blank" class="buy-btn" style="${isPast ? 'background: #8b949e;' : ''}">View on ${drop.retailer.split('.')[0]}</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderRumors(rumors) {
            const container = document.getElementById('rumorFeed');
            container.innerHTML = rumors.map(r => `
                <div class="rumor-card">
                    <div class="rumor-source"><span>${r.source}</span></div>
                    <div class="rumor-title">${r.title}</div>
                    <div class="rumor-desc">${r.desc}</div>
                    <div class="rumor-confidence">${r.confidence}</div>
                </div>
            `).join('');
        }

        function filterDrops(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderDrops(type);
        }

        loadLiveData();
    </script>
</body>
</html>
