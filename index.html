<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropDrop - Discovery Radar</title>
    <style>
        :root {
            --bg: #0b0e14; --surface: #161b22; --border: #30363d; --text: #f0f6fc;
            --accent-yellow: #f1c40f; --accent-blue: #3498db; --accent-green: #2ecc71;
            --accent-purple: #9b59b6; --accent-orange: #e67e22; --accent-red: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 1.5rem; max-width: 1500px; margin: auto; }
        
        /* POKEBALL HEADER */
        header { text-align: center; margin-bottom: 1.5rem; }
        header h1 { font-size: 2.2rem; color: var(--accent-yellow); margin-bottom: 0.2rem; }
        header p { color: #8b949e; font-size: 0.9rem; }
        .pokeball {
            display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%;
            background: linear-gradient(to bottom, #e74c3c 45%, #161b22 45%, #161b22 55%, #f0f6fc 55%);
            border: 0.08em solid #f0f6fc; position: relative; vertical-align: -0.05em; margin: 0 0.05em;
        }
        .pokeball::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 0.25em; height: 0.25em; background: #f0f6fc; border-radius: 50%; border: 0.08em solid #161b22;
        }
        
        /* AI INTEL BRIEF BANNER */
        .intel-banner {
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 1px solid #3b82f6;
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .intel-banner h2 { font-size: 1.1rem; color: #3b82f6; margin-bottom: 0.6rem; display: flex; align-items: center; gap: 8px;}
        .intel-text { color: #e5e7eb; font-size: 0.9rem; line-height: 1.5; }
        .intel-text ul { margin-top: 6px; padding-left: 20px; list-style-type: disc; }
        .intel-text li { margin-bottom: 6px; color: #d1d5db; }
        .intel-text b { color: #f0f6fc; }

        /* DASHBOARD LAYOUT */
        .dashboard-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
        @media (max-width: 1100px) { .dashboard-container { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) { .dashboard-container { grid-template-columns: 1fr; } }

        /* SCROLLABLE FEED CONTAINERS (Fixes Mobile Length!) */
        .scroll-container {
            max-height: 800px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .scroll-container::-webkit-scrollbar { width: 6px; }
        .scroll-container::-webkit-scrollbar-track { background: transparent; }
        .scroll-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* RADAR PANELS */
        .radar-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem; height: fit-content; }
        .radar-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;}
        .radar-title { font-size: 1rem; color: #3498db; display: flex; align-items: center; gap: 0.5rem; font-weight: 600;}
        
        .sync-container { display: flex; align-items: center; gap: 10px; }
        .last-sync { font-size: 0.75rem; color: #8b949e; font-family: monospace; }
        
        /* FILTERS */
        .filters { display: flex; gap: 0.6rem; width: 100%; margin-top: 5px;}
        .filter-btn { background: #0d1117; border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; transition: 0.2s; font-size: 0.75rem; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent-yellow); color: #000; font-weight: bold; }
        
        /* CARDS */
        .news-card { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 0.8rem; margin-bottom: 0.8rem; transition: border-color 0.2s;}
        .news-card:hover { border-color: #484f58; }
        .news-source { font-size: 0.65rem; color: #8b949e; display: flex; justify-content: space-between; margin-bottom: 0.6rem; text-transform: uppercase; font-weight: 600;}
        .news-title { font-size: 0.85rem; font-weight: bold; color: #f0f6fc; line-height: 1.3; margin-bottom: 0.6rem; }
        .news-desc { font-size: 0.8rem; color: #a8b2bd; line-height: 1.4; border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 4px; }
        .drop-alert { font-weight: bold; font-size: 0.65rem; display: inline-block; margin-bottom: 6px; padding: 2px 6px; border-radius: 4px; background: #161b22;}
        
        .card-img-container { background: #0b0e14; padding: 8px; border-radius: 4px; display: flex; justify-content: center; align-items: center; margin-bottom: 0.8rem; height: 120px; border: 1px solid var(--border);}
        .card-img { max-height: 100px; max-width: 100%; object-fit: contain; }
        .buy-btn { display: inline-block; margin-top: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.35rem 0.7rem; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 0.75rem; transition: 0.2s;}
        .buy-btn:hover { background: var(--border); }

    </style>
</head>
<body>
    <header>
        <h1>Dr<span class="pokeball"></span>pDr<span class="pokeball"></span>p</h1>
        <p>Pokémon TCG Drop & Restock Intelligence</p>
    </header>

    <div class="intel-banner" id="intelBanner">
        <h2>⚡ Market Intel Brief & Schedule</h2>
        <div class="intel-text" id="intelText">Warming up market radar...</div>
    </div>

    <div class="dashboard-container">
        
        <!-- REDDIT COLUMN -->
        <aside class="radar-panel" style="border-color: #f1c40f;">
            <div class="radar-header">
                <div class="radar-title" style="color: #f1c40f;">🔥 Reddit Radar</div>
                <div class="sync-container">
                    <span class="last-sync" id="lastSyncTime">Checking...</span>
                    <button class="buy-btn" onclick="loadLiveData()" style="margin:0;">🔄 Sync</button>
                </div>
                <div class="filters">
                    <button class="filter-btn active" id="btn-all" onclick="filterDrops('all')">All Intel</button>
                    <button class="filter-btn" id="btn-online" onclick="filterDrops('ONLINE')">🌐 Online Drops</button>
                </div>
            </div>
            <div class="scroll-container" id="dropGrid"></div>
        </aside>
        
        <!-- GOOGLE NEWS COLUMN -->
        <aside class="radar-panel">
            <div class="radar-header">
                <div class="radar-title">📰 Web Search Radar</div>
            </div>
            <div class="scroll-container" id="newsFeed"></div>
        </aside>

        <!-- TWITTER COLUMN -->
        <aside class="radar-panel" style="border-color: #1da1f2;">
            <div class="radar-header">
                <div class="radar-title" style="color: #1da1f2;">🐦 X / Twitter Radar</div>
            </div>
            <div class="scroll-container" id="xFeed"></div>
        </aside>
    </div>

    <script>
        let allDrops = [];

        async function loadLiveData() {
            try {
                const response = await fetch('data.json?v=' + new Date().getTime());
                const data = await response.json();
                
                // Read the actual script generation time, not the page load time!
                let syncDate = new Date();
                if (data.last_run) {
                    syncDate = new Date(data.last_run);
                }
                document.getElementById('lastSyncTime').innerText = "Updated: " + syncDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                if (data.intel_brief) {
                    document.getElementById('intelText').innerHTML = data.intel_brief;
                }

                allDrops = data.drops || [];
                
                const activeFilterBtn = document.querySelector('.filters .filter-btn.active');
                let currentFilter = 'all';
                if(activeFilterBtn && activeFilterBtn.id.replace('btn-', '') !== 'all') {
                    currentFilter = activeFilterBtn.id.replace('btn-', '').toUpperCase();
                }
                
                renderDrops(currentFilter); 
                renderNews(data.articles || [], 'newsFeed');
                renderNews(data.tweets || [], 'xFeed');
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('dropGrid').innerHTML = `<p style="color: #e74c3c;">Error loading data.json.</p>`;
                document.getElementById('lastSyncTime').innerText = "Sync failed.";
            }
        }

        function filterDrops(filter) {
            document.querySelectorAll('.filters .filter-btn').forEach(btn => {
                if (btn.id === 'btn-' + filter.toLowerCase()) btn.classList.add('active');
                else if (btn.id && btn.id.startsWith('btn-')) btn.classList.remove('active');
            });
            renderDrops(filter);
        }

        function renderDrops(filter) {
            const container = document.getElementById('dropGrid');
            container.innerHTML = '';
            
            const filtered = allDrops.filter(d => {
                if (filter === 'all' || filter === 'ALL') return true;
                return d.type === filter;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: #8b949e; font-size: 0.85rem;">No active drops for this filter.</p>`;
                return;
            }

            filtered.forEach(drop => {
                let displayDate = "Recent";
                try {
                    const localDate = new Date(drop.date);
                    if (!isNaN(localDate)) displayDate = localDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                } catch(e) {}

                let typeBadgeHTML = '';
                if (drop.type === 'ONLINE') typeBadgeHTML = `<div class="drop-alert" style="color: var(--accent-blue); border: 1px solid var(--accent-blue);">🌐 ONLINE DROP</div>`;
                else if (drop.type === 'IN-STORE') typeBadgeHTML = `<div class="drop-alert" style="color: var(--accent-orange); border: 1px solid var(--accent-orange);">🏪 IN-STORE</div>`;
                
                const cardHTML = `
                <div class="news-card">
                    <div class="news-source">
                        <span>r/${drop.sub || 'Reddit'} • ${drop.retailer || 'Store'}</span>
                        <span style="color: var(--accent-yellow);">${displayDate}</span>
                    </div>
                    ${typeBadgeHTML}
                    <div class="card-img-container">
                        <img src="${drop.image}" alt="Img" class="card-img" onerror="this.onerror=null; this.src='https://www.google.com/s2/favicons?domain=reddit.com&sz=256';">
                    </div>
                    <div class="news-title">${drop.title}</div>
                    <div class="news-desc">${drop.desc || ''}</div>
                    <a href="${drop.source_link || '#'}" target="_blank" class="buy-btn">
                        ${drop.source_link && drop.source_link.includes('reddit.com') ? '💬 Read Discussion' : '🔗 View Deal'}
                    </a>
                </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function renderNews(feedData, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return; 
            if (feedData.length === 0) {
                container.innerHTML = `<p style="color:#8b949e; font-size: 0.85rem;">No recent alerts found.</p>`;
                return;
            }
            container.innerHTML = feedData.map(n => {
                let displayDate = "Recent";
                try {
                    const localDate = new Date(n.date);
                    if (!isNaN(localDate)) displayDate = localDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                } catch(e) {}

                // Dynamic Color Coding based on AI Category!
                let borderColor = 'transparent';
                let badgeHTML = '';
                
                if (n.category === 'RESTOCK') {
                    borderColor = 'var(--accent-green)';
                    badgeHTML = `<div class="drop-alert" style="color: var(--accent-green); border: 1px solid var(--accent-green);">🚨 RESTOCK</div>`;
                } else if (n.category === 'NEWS') {
                    borderColor = 'var(--accent-blue)';
                    badgeHTML = `<div class="drop-alert" style="color: var(--accent-blue); border: 1px solid var(--accent-blue);">📰 NEWS</div>`;
                } else if (n.category === 'LEAK') {
                    borderColor = 'var(--accent-purple)';
                    badgeHTML = `<div class="drop-alert" style="color: var(--accent-purple); border: 1px solid var(--accent-purple);">👀 LEAK</div>`;
                }

                return `
                <div class="news-card" style="border-left: 3px solid ${borderColor};">
                    <div class="news-source">
                        <span>${n.source}</span>
                        <span style="color: var(--accent-yellow);">${displayDate}</span>
                    </div>
                    ${badgeHTML}
                    <a href="${n.link}" target="_blank" style="text-decoration:none;">
                        <div class="news-title">${n.title}</div>
                    </a>
                    <div class="news-desc">✨ ${n.desc}</div>
                </div>
            `}).join('');
        }

        loadLiveData();
    </script>
</body>
</html>
