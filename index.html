<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropDrop - Discovery Radar</title>
    <style>
        :root {
            --bg: #0b0e14; --surface: #161b22; --border: #30363d; --text: #f0f6fc;
            --accent-yellow: #f1c40f; --accent-blue: #3498db; --accent-green: #2ecc71;
            --accent-purple: #9b59b6; --accent-orange: #e67e22; --accent-red: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 1.5rem; max-width: 1400px; margin: auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 2.2rem; color: var(--accent-yellow); margin-bottom: 0.5rem; }
        header p { color: #8b949e; }
        .dashboard-container { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; }
        
        .pokeball {
            display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%;
            background: linear-gradient(to bottom, #e74c3c 45%, #161b22 45%, #161b22 55%, #f0f6fc 55%);
            border: 0.08em solid #f0f6fc; position: relative; vertical-align: -0.05em; margin: 0 0.05em;
        }
        .pokeball::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 0.25em; height: 0.25em; background: #f0f6fc; border-radius: 50%; border: 0.08em solid #161b22;
        }

        .filters { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent-yellow); color: #000; font-weight: bold; }
        
        .drop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card-img-container { width: 100%; height: 180px; background: #0d1117; display: flex; align-items: center; justify-content: center; padding: 1.5rem; border-bottom: 1px solid var(--border); }
        .card-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
        .card-body { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; }
        
        .tags { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
        .badge { font-size: 0.7rem; padding: 0.2rem 0.4rem; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .badge-live { background: var(--accent-green); color: #000; }
        .badge-past { background: var(--accent-red); color: #fff; }
        .badge-domain { background: var(--accent-blue); color: #fff; }
        
        .card-title { font-size: 1rem; margin-bottom: 0.4rem; line-height: 1.3; }
        .price { color: var(--accent-yellow); font-size: 0.95rem; font-weight: bold; margin-bottom: 0.5rem; }
        .countdown { margin-top: auto; font-family: monospace; font-size: 0.8rem; background: #0d1117; padding: 0.4rem; border-radius: 6px; text-align: center; color: #8b949e; border: 1px solid #21262d; }
        .buy-btn { display: block; margin-top: 0.8rem; text-align: center; background: var(--accent-yellow); color: #000; padding: 0.5rem; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        
        .radar-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem; height: fit-content; }
        .radar-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; margin-bottom: 1rem; }
        .radar-title { font-size: 1.1rem; color: #3498db; display: flex; align-items: center; gap: 0.5rem; }
        
        .news-card { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; margin-bottom: 0.8rem; }
        .news-source { font-size: 0.7rem; color: #8b949e; display: flex; justify-content: space-between; margin-bottom: 0.4rem; text-transform: uppercase; }
        .news-title { font-size: 0.9rem; font-weight: bold; color: #f0f6fc; line-height: 1.3; }
    </style>
</head>
<body>
    <header>
        <h1>Dr<span class="pokeball"></span>pDr<span class="pokeball"></span>p</h1>
        <p>DropDrop?</p>
    </header>
    <div class="dashboard-container">
        <main>
            <div class="filters">
                <button class="filter-btn active" onclick="filterDrops('all')">All Active Deals</button>
                <button class="filter-btn" onclick="filterDrops('today')">Added Today</button>
                <button class="filter-btn" onclick="filterDrops('week')">This Week</button>
                <button class="filter-btn" onclick="filterDrops('past')">Expired / Past</button>
                <button class="filter-btn" onclick="loadLiveData()" style="background: var(--accent-blue); color: white; margin-left: auto;">🔄 Sync Latest Data</button>
            </div>
            <div class="drop-grid" id="dropGrid"></div>
        </main>
        <aside class="radar-panel">
            <div class="radar-header">
                <div class="radar-title">📰 Web News Radar</div>
            </div>
            <div id="newsFeed"></div>
        </aside>
    </div>

    <script>
        let allDrops = [];

        async function loadLiveData() {
            try {
                const response = await fetch('data.json?v=' + new Date().getTime());
                const data = await response.json();
                allDrops = data.drops || [];
                
                renderDrops('all'); 
                renderNews(data.news || []);
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('dropGrid').innerHTML = `<p style="color: #e74c3c; grid-column: 1/-1; text-align:center;">Error loading data.json. Check GitHub Actions!</p>`;
            }
        }

        function renderDrops(filter) {
            const container = document.getElementById('dropGrid');
            container.innerHTML = '';
            const now = new Date();
            
            const filtered = allDrops.filter(d => {
                const dropDate = new Date(d.date);
                const hoursDiff = (now - dropDate) / (1000 * 60 * 60);
                
                if (filter === 'past') return d.status === 'past';
                if (d.status === 'past') return false; 
                
                if (filter === 'today') return hoursDiff <= 24;
                if (filter === 'week') return hoursDiff <= 168; 
                
                return true; 
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: #8b949e; grid-column: 1/-1; text-align:center;">No drops found for this filter.</p>`;
                return;
            }

            filtered.forEach(drop => {
                const isPast = drop.status === 'past';
                const card = document.createElement('div');
                card.className = 'card';
                card.style.opacity = isPast ? '0.7' : '1'; 

                let badgeHTML = isPast ? `<span class="badge badge-past">EXPIRED / OOS</span>` : `<span class="badge badge-live">ACTIVE DEAL</span>`;
                
                let displayDate = "Recent";
                try {
                    displayDate = new Date(drop.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                } catch(e) {}

                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${drop.image}" alt="Product Image" class="card-img" onerror="this.src='https://via.placeholder.com/200x150?text=No+Thumbnail'">
                    </div>
                    <div class="card-body">
                        <div class="tags">
                            ${badgeHTML}
                            <span class="badge badge-domain">${drop.retailer}</span>
                        </div>
                        <h2 class="card-title">${drop.title}</h2>
                        <div class="price">${drop.price}</div>
                        <div class="countdown">Found: ${displayDate}</div>
                        
                        <details style="margin-top: 10px; font-size: 0.85rem; color: #8b949e;">
                            <summary style="cursor: pointer; outline: none; margin-bottom: 5px; color: #f1c40f;">View Description & Links</summary>
                            <div style="line-height: 1.4;">${drop.desc}</div>
                        </details>
                        
                        <div style="display: flex; gap: 0.5rem; margin-top: auto; padding-top: 1rem;">
                            <a href="${drop.source_link}" target="_blank" class="buy-btn" style="flex: 1; background: #3498db; color: white;">💬 View Thread</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderNews(news) {
            const container = document.getElementById('newsFeed');
            if(!container) return; 
            container.innerHTML = news.map(n => `
                <div class="news-card">
                    <div class="news-source">
                        <span>${n.source}</span>
                        <span>${n.date}</span>
                    </div>
                    <a href="${n.link}" target="_blank" style="text-decoration:none;">
                        <div class="news-title">${n.title}</div>
                    </a>
                </div>
            `).join('');
        }

        function filterDrops(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderDrops(type);
        }

        loadLiveData();
    </script>
</body>
</html>
